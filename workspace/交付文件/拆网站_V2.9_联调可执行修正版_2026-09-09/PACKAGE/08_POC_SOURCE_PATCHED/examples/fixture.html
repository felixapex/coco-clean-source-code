<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Component Engine Demo</title>
<style>
body{font-family:Arial,sans-serif;margin:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{display:flex;gap:12px;padding:16px;border:1px solid #ddd;border-radius:8px}.compact{padding:12px;background:#f8f8f8}button{padding:8px 12px}
</style>
</head>
<body>
<main class="grid">
  <article class="card" data-component="ProductCard" data-semantic-role="product-card" data-variant="default"><div><h2>Oak Chair</h2><p>$199</p></div><button>Favorite</button></article>
  <article class="card compact" data-component="ProductCard" data-semantic-role="product-card" data-variant="compact"><div><h2>Walnut Chair</h2><p>$249</p></div><button>Saved</button></article>
</main>
</body>
</html>
